# The extensive tests run the full set of example calls in
# noinst/extensive/ex_run.csv. They take a few minutes, which is too much for
# every push and every pull request, so they are not part of R-CMD-check.
#
# They run once a month, and on demand from the Actions tab. Run them before a
# release. The monthly run is there to catch drift we did not cause: a new
# X-13 binary, a new R, a changed dependency.

on:
  workflow_dispatch:
  schedule:
    # first of the month, 05:00 UTC
    - cron: '0 5 1 * *'

name: extensive tests

jobs:
  extensive-tests:
    runs-on: ubuntu-latest

    name: extensive tests

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      SEASONAL_EXTENSIVE_TESTS: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
          needs: check

      - name: Run extensive tests
        run: testthat::test_local(filter = "extensive", stop_on_failure = TRUE)
        shell: Rscript {0}
